schema_version: 1

context:
  name: opentelemetry-instrumentation-litellm
  version: "0.63.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_litellm-${{ version }}.tar.gz
  sha256: 63090780e76be58e99aa1a69a02c8db549bed6f00554cee220a7d90ac0da423c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.63b1
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
  run_constraints:
    - litellm >=1.0.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.litellm
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: OpenTelemetry LiteLLM instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
